name: Windows build (artifact)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Compile
      shell: cmd
      run: |
        cd paint
        ..\base\make --compile

    - name: Show build output
      shell: cmd
      run: dir /s /b paint\build\out

    - name: Upload ArmorPaint
      uses: actions/upload-artifact@v4
      with:
        name: armorpaint-windows-x64
        path: paint/build/out/
        if-no-files-found: error
